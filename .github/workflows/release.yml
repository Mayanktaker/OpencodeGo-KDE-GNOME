# © Mayanktaker Computers & Web Development | https://mayanktaker.com
# Automated Release Pipeline for OpenCode Go KDE Plasmoid & CLI Utility

name: Release Pipeline

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate QML & JS Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate QML & JS Syntax
        run: bash .github/workflows/validate.sh

      - name: Install gjs for the GNOME extension suites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gjs libglib2.0-bin libadwaita-1-0 gir1.2-adw-1

      - name: Validate GNOME Extension
        run: bash gnome-extension/tests/run-tests.sh

  build-and-release:
    name: Build & Package Plasmoid Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Release Version Environment Variable
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/heads/master" ]; then
            # Fall back to the version in metadata.json so this can never go stale
            TAG="v$(python3 -c "import json;print(json.load(open('metadata.json'))['KPlugin']['Version'])")"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_ENV
          echo "Building release for version ${TAG}..."

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip imagemagick

      - name: Generate PNG Icons from Redesigned SVG Logo
        run: |
          echo "Generating PNG app icon sizes from assets/icon.svg..."
          mkdir -p contents/icons/
          cp assets/icon.svg contents/icons/com.mayanktaker.opencodego-usage.svg

      - name: Package .plasmoid Bundle Archive
        run: |
          PLASMOID_NAME="com.mayanktaker.opencodego-usage-${{ env.VERSION }}.plasmoid"
          zip -r "${PLASMOID_NAME}" metadata.json contents/ LICENSE README.md assets/
          echo "PLASMOID_FILE=${PLASMOID_NAME}" >> $GITHUB_ENV

      - name: Package Shareable Release ZIP Archive
        run: |
          ZIP_NAME="opencode-go-usage-${{ env.VERSION }}.zip"
          # gnome-extension/ ships in the shared bundle so GNOME users get it too;
          # the repo-local dev artifacts and the compiled schema are left out
          rm -rf gnome-extension/schemas/gschemas.compiled
          zip -r "${ZIP_NAME}" \
            "${{ env.PLASMOID_FILE }}" \
            install.sh \
            install-cli.sh \
            metadata.json \
            contents/ \
            bin/ \
            assets/ \
            gnome-extension/ \
            README.md \
            LICENSE \
            -x "*.git*" "*/tests/*" "*/__pycache__/*"
          echo "ZIP_FILE=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Package GNOME Shell Extension Bundle
        run: |
          bash gnome-extension/package.sh
          echo "GNOME_ZIP_FILE=gnome-extension/build/opencodego-usage@mayanktaker.com.shell-extension.zip" >> $GITHUB_ENV

      - name: Generate Checksums
        run: |
          # Checksums must reference the uploaded asset names (flat), not repo paths,
          # so `sha256sum -c SHA256SUMS` works in a plain download folder
          STAGE="$(mktemp -d)"
          cp "${{ env.PLASMOID_FILE }}" "${{ env.ZIP_FILE }}" "$STAGE/"
          cp gnome-extension/build/*.shell-extension.zip "$STAGE/"
          (cd "$STAGE" && sha256sum *.plasmoid *.zip > "$GITHUB_WORKSPACE/SHA256SUMS")
          echo "SHA256SUMS generated:"
          cat SHA256SUMS

      - name: Upload Release Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          files: |
            ${{ env.PLASMOID_FILE }}
            ${{ env.ZIP_FILE }}
            gnome-extension/build/*.shell-extension.zip
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
